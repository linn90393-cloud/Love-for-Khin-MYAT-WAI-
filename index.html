<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <style>
        body {
            background-color: #ffe6eb;
            margin: 0;
            padding: 15px;
            font-family: sans-serif;
            text-align: center;
        }
        .main-container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #d81b60;
            margin-bottom: 15px;
        }
        .memory-album {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            justify-items: center;
            margin-bottom: 20px;
        }
        .polaroid {
            background: #fffdf8;
            padding: 8px 8px 12px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .polaroid img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
        }
        .polaroid p {
            margin: 6px 0 0 0;
            font-size: 11px;
            color: #d81b60;
        }
        .music-box {
            background: #fff0f3;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .love-letter {
            background: #fff0f3;
            padding: 15px;
            border-radius: 12px;
            color: #853d60;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>ကိုတို့နှစ်ယောက်ရဲ့ အမှတ်တရများ ❤️</h2>
        
        <!-- Polaroid Album (ဓာတ်ပုံ ၄ ပုံ) -->
        <div class="memory-album">
            <div class="polaroid">
                <img src="IMG_20260927_140358_052.jpg" alt="Memory 1">
                <p>Our Sweet Memory</p>
            </div>
            <div class="polaroid">
                <img src="IMG_20260319_174238_600.jpg" alt="Memory 2">
                <p>2022 With You</p>
            </div>
            <div class="polaroid">
                <img src="IMG_20260401_174341_879.jpg" alt="Memory 3">
                <p>Favorite Person</p>
            </div>
            <div class="polaroid">
                <img src="IMG_20260719_180841.jpg" alt="Memory 4">
                <p>Happy Moments</p>
            </div>
        </div>

        <!-- သီချင်းဖွင့်စက် (Music Player) -->
        <div class="music-box">
            <p style="margin: 0 0 8px 0; font-size: 12px; color: #d81b60; font-weight: bold;">🎵 သီချင်းလေး ဖွင့်နားဆင်ရန်</p>
            <audio controls style="width: 100%;">
                <source src="Song.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- ချစ်စာ -->
        <div class="love-letter">
            <h3>မောင့်ကလေးလေးအတွက် ချစ်စာ 💌</h3>
            <p>မက မောင့်ဘဝရဲ့ အရေးကြီးဆုံး လူသားလေးပါ၊ မနဲ့အတူ အမှတ်တရလှလှများအများကြီး ဖန်တီးသွားချင်တယ်။ မောင့်ရဲ့ အချစ်တွေအားလုံးနဲ့...<br><strong>Kyaw San Linn ❤️</strong></p>
        </div>
    </div>

</body>
</html>
